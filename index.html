<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GRD shipment monitoring dashboard." />
    <script>
      (() => {
        let savedPreference = null;
        try {
          savedPreference = localStorage.getItem('grd-theme-mode');
        } catch {}
        const preference =
          savedPreference === 'light' || savedPreference === 'dark' ? savedPreference : 'system';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const colorScheme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        document.documentElement.setAttribute('data-grd-color-scheme', colorScheme);
        document.documentElement.setAttribute('data-grd-favicon', colorScheme);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link id="grd-favicon" rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      if (document.documentElement.getAttribute('data-grd-favicon') === 'dark')
        document.querySelector('#grd-favicon').href = '/favicon-dark.svg';
    </script>
    <title>GRD Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
