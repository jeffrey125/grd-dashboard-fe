name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSKY: '0'
      VITE_API_ORIGIN: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all application gates
        run: pnpm run ci
      - name: Retain coverage baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all committed history
        run: '"${{ runner.temp }}/gitleaks" git --redact --no-banner --log-opts="--all" .'

  container:
    name: Build production frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .do/Dockerfile
          push: false
          load: true
          tags: grd-frontend:ci
          build-args: |
            EXPECTED_COMMIT=${{ github.sha }}
            BUILD_COMMIT=${{ github.sha }}
            VITE_API_ORIGIN=https://api.globalresourcesdirect.com
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Check extracted static artifact
        run: |
          set -euo pipefail
          container=$(docker create grd-frontend:ci /bin/true)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/dist" "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -d "$RUNNER_TEMP/site/assets"
          test ! -e "$RUNNER_TEMP/site/.env"

  deploy:
    name: Deploy App Platform fe
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, secrets, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.globalresourcesdirect.com
    concurrency:
      group: app-platform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip superseded releases
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: revision superseded on main.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate production inputs
        if: steps.release.outputs.current == 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_PROJECT_ID: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
        run: |
          set -euo pipefail
          for key in DIGITALOCEAN_ACCESS_TOKEN DIGITALOCEAN_PROJECT_ID; do
            [[ -n "${!key}" ]] || { echo "::error::Missing production setting: $key"; exit 1; }
          done
      - name: Build the verified commit and wait for deployment
        id: deploy
        if: steps.release.outputs.current == 'true'
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ vars.VITE_GOOGLE_PLACES_API_KEY }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          project_id: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
          app_spec_location: .do/app.yaml
          print_build_logs: 'false'
          print_deploy_logs: 'false'
      - name: Verify public deployment
        if: steps.release.outputs.current == 'true'
        run: bash scripts/check-app-platform.sh https://app.globalresourcesdirect.com
      - name: Record successful release
        if: steps.release.outputs.current == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ vars.VITE_GOOGLE_PLACES_API_KEY }}
        run: printf 'Verified %s at %s\n' "$EXPECTED_COMMIT" 'https://app.globalresourcesdirect.com' >> "$GITHUB_STEP_SUMMARY"
