name: grd-dashboard

x-backend-runtime: &backend-runtime
  image: ${GRD_BACKEND_IMAGE:?Set GRD_BACKEND_IMAGE}
  pull_policy: never
  init: true
  stop_grace_period: 40s
  security_opt:
    - no-new-privileges:true

x-database: &database
  DB_HOST: db
  DB_PORT: '5432'
  DB_NAME: ${GRD_DB_NAME:?Set GRD_DB_NAME}
  DB_USER: ${GRD_DB_USER:?Set GRD_DB_USER}
  DB_PASSWORD: ${GRD_DB_PASSWORD:?Set GRD_DB_PASSWORD}
  DB_SSL_MODE: disable

services:
  db:
    image: postgres:18.3-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: ${GRD_DB_NAME:?Set GRD_DB_NAME}
      POSTGRES_USER: ${GRD_DB_USER:?Set GRD_DB_USER}
      POSTGRES_PASSWORD: ${GRD_DB_PASSWORD:?Set GRD_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend-runtime
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/infrastructure/database/data-source.js',
      ]
    environment:
      <<: *database
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *backend-runtime
    environment:
      <<: *database
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '3000'
      AUTH_SECRET: ${GRD_AUTH_SECRET:?Set GRD_AUTH_SECRET}
      AUTH_BASE_URL: ${GRD_ORIGIN:?Set GRD_ORIGIN}
      AUTH_TRUSTED_ORIGINS: ${GRD_ORIGIN:?Set GRD_ORIGIN}
      AUTH_TRUST_PROXY: loopback
    ports:
      - '${GRD_LAN_IP:?Set GRD_LAN_IP}:${GRD_HTTP_PORT:-80}:80'
      - '${GRD_LAN_IP:?Set GRD_LAN_IP}:${GRD_HTTPS_PORT:-443}:443'
      - '${GRD_LAN_IP:?Set GRD_LAN_IP}:${GRD_HTTPS_PORT:-443}:443/udp'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL

  frontend:
    image: ${GRD_FRONTEND_IMAGE:?Set GRD_FRONTEND_IMAGE}
    pull_policy: never
    network_mode: service:api
    environment:
      GRD_LAN_IP: ${GRD_LAN_IP:?Set GRD_LAN_IP}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate --quiet --spider https://$${GRD_LAN_IP}/healthz',
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  worker:
    <<: *backend-runtime
    profiles: ['worker']
    command: ['node', 'dist/worker.js']
    environment:
      <<: *database
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPS_ENVIRONMENT: ${UPS_ENVIRONMENT:-cie}
      UPS_CLIENT_ID: ${UPS_CLIENT_ID:-}
      UPS_CLIENT_SECRET: ${UPS_CLIENT_SECRET:-}
      AMAZON_SP_API_SANDBOX_CLIENT_ID: ${AMAZON_SP_API_SANDBOX_CLIENT_ID:-}
      AMAZON_SP_API_SANDBOX_CLIENT_SECRET: ${AMAZON_SP_API_SANDBOX_CLIENT_SECRET:-}
      AMAZON_SP_API_SANDBOX_REFRESH_TOKEN: ${AMAZON_SP_API_SANDBOX_REFRESH_TOKEN:-}
      MYUNISHIPPERS_EMAIL: ${MYUNISHIPPERS_EMAIL:-}
      MYUNISHIPPERS_PASSWORD: ${MYUNISHIPPERS_PASSWORD:-}
      ECHOSHIP_URL: ${ECHOSHIP_URL:-https://echoship.com/login}
      ECHOSHIP_USERNAME: ${ECHOSHIP_USERNAME:-}
      ECHOSHIP_PASSWORD: ${ECHOSHIP_PASSWORD:-}
      FFE_URL: ${FFE_URL:-https://www.ffeinc.com/Customer/ShipmentTracking}
      FFE_USERNAME: ${FFE_USERNAME:-}
      FFE_PASSWORD: ${FFE_PASSWORD:-}
      NTFY_URL: ${NTFY_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 1gb
    cap_drop:
      - ALL
    deploy:
      replicas: 1

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
